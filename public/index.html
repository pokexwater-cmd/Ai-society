<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Society Simulator</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0d;
    color: #f5f5f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: #9a9aa2; font-size: 14px; }
  #status {
    margin-top: 20px;
    padding: 10px 18px;
    border-radius: 10px;
    background: #16161b;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h1>AI Society Simulator</h1>
  <p>Backend skeleton — step 1</p>
  <div id="status">Checking server + database…</div>

  <script>
    fetch('/health')
      .then(r => r.json())
      .then(data => {
        document.getElementById('status').textContent =
          data.status === 'ok'
            ? '✅ Server and database are connected.'
            : '❌ Something is wrong: ' + data.message;
      })
      .catch(err => {
        document.getElementById('status').textContent = '❌ Could not reach server: ' + err.message;
      });
  </script>
</body>
</html>
