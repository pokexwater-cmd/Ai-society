<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI Society Simulator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #0a0a0d;
    color: #f2f2f5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body { padding-bottom: 90px; }

  header {
    padding: 18px 16px 12px;
    text-align: center;
    border-bottom: 1px solid #1c1c22;
  }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p { font-size: 12px; color: #8a8a92; margin: 0; }

  #turn-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #16161b;
    font-size: 12px;
    color: #cfcfd6;
  }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }

  h2.section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8a8a92;
    margin: 24px 0 10px;
  }

  #character-cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .char-card {
    background: #16161b;
    border: 1px solid #232329;
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .char-card:active { background: #1c1c22; }
  .char-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .char-name { font-size: 16px; font-weight: 600; }
  .char-mood {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    background: #232329;
    color: #cfcfd6;
    text-transform: capitalize;
  }
  .char-meta {
    display: flex;
    gap: 14px;
    margin-top: 8px;
    font-size: 12px;
    color: #9a9aa2;
  }
  .char-meta span b { color: #f2f2f5; font-weight: 600; }

  #event-log {
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
    background: #101014;
    border-radius: 12px;
    padding: 12px;
    border: 1px solid #1c1c22;
  }
  .event-entry {
    font-size: 13px;
    line-height: 1.5;
    padding-bottom: 8px;
    border-bottom: 1px solid #1c1c22;
  }
  .event-entry:first-child { border-bottom: none; padding-bottom: 0; }
  .event-turn { color: #6b6b74; font-size: 11px; margin-right: 6px; }

  #empty-log { color: #6b6b74; font-size: 13px; text-align: center; padding: 20px 0; }

  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: #0a0a0d;
    border-top: 1px solid #1c1c22;
    display: flex;
    gap: 10px;
  }
  #next-turn-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: #4ade80;
    color: #06280f;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  #next-turn-btn:active { background: #3fc76f; }
  #next-turn-btn:disabled { opacity: 0.5; }

  #detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    z-index: 20;
  }
  #detail-overlay.visible { display: flex; }
  #detail-panel {
    background: #101014;
    width: 100%;
    max-height: 82vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid #232329;
  }
  #detail-panel h2 { margin: 0 0 4px; font-size: 20px; }
  #detail-panel .sub { color: #9a9aa2; font-size: 13px; margin-bottom: 16px; }
  #detail-panel .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #1c1c22;
    font-size: 13px;
  }
  #detail-panel .stat-row b { color: #cfcfd6; }
  #detail-panel h3 {
    font-size: 12px;
    text-transform: uppercase;
    color: #8a8a92;
    margin: 18px 0 8px;
  }
  #detail-panel .mem-item, .rel-item {
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 1px solid #1c1c22;
    line-height: 1.4;
  }
  #close-detail {
    float: right;
    background: #1c1c22;
    border: none;
    color: #cfcfd6;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }

  #godmode-btn {
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #16161b;
    color: #f2f2f5;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #godmode-btn:active { background: #1c1c22; }

  #godmode-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    z-index: 25;
  }
  #godmode-overlay.visible { display: flex; }
  #godmode-panel {
    background: #101014;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid #232329;
  }
  #godmode-panel h2 { margin: 0 0 16px; font-size: 18px; }
  .gm-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .gm-tab {
    padding: 8px 14px;
    border-radius: 999px;
    background: #1c1c22;
    border: none;
    color: #cfcfd6;
    font-size: 13px;
    cursor: pointer;
  }
  .gm-tab.active { background: #4ade80; color: #06280f; font-weight: 600; }
  .gm-form { display: none; flex-direction: column; gap: 10px; }
  .gm-form.active { display: flex; }
  .gm-form label { font-size: 12px; color: #9a9aa2; margin-bottom: -4px; }
  .gm-form select, .gm-form input, .gm-form textarea {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid #2a2a32;
    background: #16161b;
    color: #f2f2f5;
    font-size: 14px;
    font-family: inherit;
  }
  .gm-form textarea { resize: vertical; min-height: 70px; }
  .gm-submit {
    margin-top: 6px;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: #4ade80;
    color: #06280f;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .gm-submit:active { background: #3fc76f; }
  #close-godmode {
    float: right;
    background: #1c1c22;
    border: none;
    color: #cfcfd6;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }

  #toast {
    position: fixed;
    top: max(16px, env(safe-area-inset-top, 16px));
    left: 16px; right: 16px;
    background: rgba(220,60,60,0.95);
    color: #fff;
    padding: 12px 16px;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    display: none;
    z-index: 30;
  }
  #toast.visible { display: block; }
</style>
</head>
<body>

<header>
  <h1>AI Society Simulator</h1>
  <p>Watch three minds make their own choices</p>
  <div id="turn-badge">Turn —</div>
</header>

<main>
  <h2 class="section-title">Characters</h2>
  <div id="character-cards"></div>

  <h2 class="section-title">Event Log</h2>
  <div id="event-log"><div id="empty-log">No events yet — tap Next Turn to begin.</div></div>
</main>

<div id="controls">
  <button id="godmode-btn">⚡ Intervene</button>
  <button id="next-turn-btn">Next Turn</button>
</div>

<div id="toast"></div>

<div id="detail-overlay">
  <div id="detail-panel"></div>
</div>

<div id="godmode-overlay">
  <div id="godmode-panel">
    <button id="close-godmode">&times;</button>
    <h2>⚡ Intervene</h2>

    <div class="gm-tabs">
      <button class="gm-tab active" data-form="money">Money</button>
      <button class="gm-tab" data-form="move">Move</button>
      <button class="gm-tab" data-form="event">Event</button>
      <button class="gm-tab" data-form="secret">Secret</button>
    </div>

    <form class="gm-form active" id="form-money">
      <label>Character</label>
      <select name="name" id="money-name"></select>
      <label>Amount (negative to take away)</label>
      <input type="number" name="amount" placeholder="e.g. 50 or -20" required />
      <button type="submit" class="gm-submit">Apply</button>
    </form>

    <form class="gm-form" id="form-move">
      <label>Character</label>
      <select name="name" id="move-name"></select>
      <label>New location</label>
      <input type="text" name="location" placeholder="e.g. Market, Tavern, Town Square" required />
      <button type="submit" class="gm-submit">Apply</button>
    </form>

    <form class="gm-form" id="form-event">
      <label>Event description</label>
      <textarea name="description" placeholder="e.g. A fire broke out near the market stalls." required></textarea>
      <label>Location</label>
      <input type="text" name="location" placeholder="e.g. Market" required />
      <button type="submit" class="gm-submit">Trigger Event</button>
    </form>

    <form class="gm-form" id="form-secret">
      <label>Character (only they will know this)</label>
      <select name="name" id="secret-name"></select>
      <label>Secret information</label>
      <textarea name="memoryText" placeholder="e.g. You secretly saw Alisha take the coins." required></textarea>
      <button type="submit" class="gm-submit">Give Secret</button>
    </form>
  </div>
</div>

<script>
const cardsEl = document.getElementById('character-cards');
const logEl = document.getElementById('event-log');
const turnBadge = document.getElementById('turn-badge');
const nextTurnBtn = document.getElementById('next-turn-btn');
const toast = document.getElementById('toast');
const detailOverlay = document.getElementById('detail-overlay');
const detailPanel = document.getElementById('detail-panel');

let charactersCache = [];

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 4000);
}

async function loadCharacters() {
  const res = await fetch('/characters');
  const data = await res.json();
  if (data.status !== 'ok') throw new Error(data.message);
  charactersCache = data.characters;
  renderCharacters();
}

function renderCharacters() {
  cardsEl.innerHTML = '';
  charactersCache.forEach(c => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.innerHTML = `
      <div class="char-card-top">
        <div class="char-name">${c.name}</div>
        <div class="char-mood">${c.mood}</div>
      </div>
      <div class="char-meta">
        <span>📍 <b>${c.location}</b></span>
        <span>💰 <b>₹${c.money}</b></span>
      </div>
    `;
    card.addEventListener('click', () => openDetail(c.id));
    cardsEl.appendChild(card);
  });
}

async function loadEvents() {
  const res = await fetch('/events');
  const data = await res.json();
  if (data.status !== 'ok') throw new Error(data.message);

  if (data.events.length === 0) {
    logEl.innerHTML = '<div id="empty-log">No events yet — tap Next Turn to begin.</div>';
    return;
  }

  logEl.innerHTML = data.events.map(e => `
    <div class="event-entry">
      <span class="event-turn">Turn ${e.turn_number}</span>${e.description}
    </div>
  `).join('');
}

async function loadTurn() {
  const eventsRes = await fetch('/events');
  const eventsData = await eventsRes.json();
  const latestTurn = eventsData.events.length > 0 ? eventsData.events[0].turn_number : 0;
  turnBadge.textContent = `Turn ${latestTurn}`;
}

async function openDetail(characterId) {
  const character = charactersCache.find(c => c.id === characterId);
  if (!character) return;

  detailPanel.innerHTML = `<div style="text-align:center;padding:30px;color:#8a8a92;">Loading…</div>`;
  detailOverlay.classList.add('visible');

  const [memRes, relRes] = await Promise.all([
    fetch('/memories'),
    fetch('/relationships')
  ]);
  const memData = await memRes.json();
  const relData = await relRes.json();

  const myMemories = memData.memories
    .filter(m => m.character_name === character.name)
    .slice(-8)
    .reverse();

  const myRelationships = relData.relationships
    .filter(r => r.from_character === character.name);

  detailPanel.innerHTML = `
    <button id="close-detail">&times;</button>
    <h2>${character.name}</h2>
    <div class="sub">${character.personality}</div>

    <div class="stat-row"><span>Location</span><b>${character.location}</b></div>
    <div class="stat-row"><span>Money</span><b>₹${character.money}</b></div>
    <div class="stat-row"><span>Mood</span><b>${character.mood}</b></div>
    <div class="stat-row"><span>Goals</span><b>${character.goals}</b></div>
    <div class="stat-row"><span>Fears</span><b>${character.fears}</b></div>
    <div class="stat-row"><span>Values</span><b>${character.values_priority}</b></div>
    <div class="stat-row"><span>Skills</span><b>${character.skills}</b></div>

    <h3>Relationships</h3>
    ${myRelationships.length > 0
      ? myRelationships.map(r => `
        <div class="rel-item">
          <b>${r.to_character}</b> — trust ${r.trust}/100, affinity ${r.affinity}/100
        </div>
      `).join('')
      : '<div class="rel-item">No relationship data.</div>'
    }

    <h3>Recent Memories</h3>
    ${myMemories.length > 0
      ? myMemories.map(m => `<div class="mem-item">${m.event_description}</div>`).join('')
      : '<div class="mem-item">No memories yet.</div>'
    }
  `;

  document.getElementById('close-detail').addEventListener('click', () => {
    detailOverlay.classList.remove('visible');
  });
}

detailOverlay.addEventListener('click', (e) => {
  if (e.target === detailOverlay) detailOverlay.classList.remove('visible');
});

const godmodeBtn = document.getElementById('godmode-btn');
const godmodeOverlay = document.getElementById('godmode-overlay');
const closeGodmode = document.getElementById('close-godmode');
const gmTabs = document.querySelectorAll('.gm-tab');
const gmForms = document.querySelectorAll('.gm-form');

function populateCharacterSelects() {
  const selects = [
    document.getElementById('money-name'),
    document.getElementById('move-name'),
    document.getElementById('secret-name')
  ];
  selects.forEach(sel => {
    sel.innerHTML = charactersCache.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
  });
}

godmodeBtn.addEventListener('click', () => {
  populateCharacterSelects();
  godmodeOverlay.classList.add('visible');
});
closeGodmode.addEventListener('click', () => godmodeOverlay.classList.remove('visible'));
godmodeOverlay.addEventListener('click', (e) => {
  if (e.target === godmodeOverlay) godmodeOverlay.classList.remove('visible');
});

gmTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    gmTabs.forEach(t => t.classList.remove('active'));
    gmForms.forEach(f => f.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('form-' + tab.dataset.form).classList.add('active');
  });
});

async function refreshWorld() {
  await loadCharacters();
  await loadEvents();
  await loadTurn();
}

document.getElementById('form-money').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const res = await fetch('/intervene/money', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: fd.get('name'), amount: Number(fd.get('amount')) })
    });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    await refreshWorld();
    godmodeOverlay.classList.remove('visible');
    e.target.reset();
  } catch (err) {
    showToast('Error: ' + err.message);
  }
});

document.getElementById('form-move').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const res = await fetch('/intervene/move', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: fd.get('name'), location: fd.get('location') })
    });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    await refreshWorld();
    godmodeOverlay.classList.remove('visible');
    e.target.reset();
  } catch (err) {
    showToast('Error: ' + err.message);
  }
});

document.getElementById('form-event').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const res = await fetch('/intervene/event', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: fd.get('description'), location: fd.get('location') })
    });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    await refreshWorld();
    godmodeOverlay.classList.remove('visible');
    e.target.reset();
  } catch (err) {
    showToast('Error: ' + err.message);
  }
});

document.getElementById('form-secret').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const res = await fetch('/intervene/secret', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: fd.get('name'), memoryText: fd.get('memoryText') })
    });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    showToast('Secret given.');
    godmodeOverlay.classList.remove('visible');
    e.target.reset();
  } catch (err) {
    showToast('Error: ' + err.message);
  }
});

nextTurnBtn.addEventListener('click', async () => {
  nextTurnBtn.disabled = true;
  nextTurnBtn.textContent = 'Thinking…';
  try {
    const res = await fetch('/run-turn');
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);

    await loadCharacters();
    await loadEvents();
    await loadTurn();
  } catch (err) {
    showToast('Error: ' + err.message);
  } finally {
    nextTurnBtn.disabled = false;
    nextTurnBtn.textContent = 'Next Turn';
  }
});

async function init() {
  try {
    await loadCharacters();
    await loadEvents();
    await loadTurn();
    populateCharacterSelects();
  } catch (err) {
    showToast('Error loading world: ' + err.message);
  }
}

init();
</script>

</body>
</html>
